# Deploiement (NAS UGREEN, etc.) : images pre-construites par les CI/CD des
# deux depots (voir api/.github/workflows/ et web/.github/workflows/), aucun
# build local. Mettre a jour :
#
#   git submodule update --remote --merge   # optionnel: avance les pointeurs
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# Necessite un `docker login ghcr.io` prealable si les packages GHCR sont
# prives (voir README).
name: ananas

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: ghcr.io/benoitdw/ananas_backend:latest
    command: uvicorn ananas.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRE_DAYS: ${JWT_EXPIRE_DAYS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Derriere le HTTPS de NPM : cookie de session en Secure.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-3.7-flash}
      TZ: ${TZ}
    ports:
      # Utile en debug/local ; en prod c'est NPM qui atteint `backend:8000`
      # via le reseau `proxy`, l'exposition sur l'hote n'est pas requise.
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - default
      - proxy
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: ghcr.io/benoitdw/ananas_backend:latest
    command: python -m ananas.worker.main
    environment:
      DATABASE_URL: ${DATABASE_URL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      AI_MODEL: ${AI_MODEL:-gemini-3.7-flash}
      TZ: ${TZ}
      SCRAPE_CRON_HOUR: ${SCRAPE_CRON_HOUR}
      SCRAPE_CRON_MINUTE: ${SCRAPE_CRON_MINUTE}
      NOTIFY_CRON_HOUR: ${NOTIFY_CRON_HOUR:-7}
      NOTIFY_CRON_MINUTE: ${NOTIFY_CRON_MINUTE:-0}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: ghcr.io/benoitdw/ananas_web:latest
    environment:
      # lu au runtime (adapter-node, $env/dynamic/public): pas besoin de
      # rebuild l'image pour changer l'URL exposee au navigateur.
      PUBLIC_API_URL: ${PUBLIC_API_URL}
    ports:
      - "${WEB_PORT:-3000}:3000"
    networks:
      - default
      - proxy
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

networks:
  # Reseau interne du projet (db <-> backend <-> worker <-> web).
  default:
  # Reseau partage avec Nginx Proxy Manager. Cree-le une fois sur le NAS :
  #   docker network create proxy
  # puis rattache le conteneur NPM a ce reseau. NPM peut alors proxifier
  # `web:3000` (front) et `backend:8000` (API) par nom de service.
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
